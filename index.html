<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃鉄Web - CPU対戦＆最大4人対応版</title>
  
  <!-- PeerJS（外部ライブラリ） -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- 🎨 分割したCSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 🎲 3Dサイコロ演出用モーダル -->
  <div id="dice-3d-modal">
    <div id="dice-wrapper" class="dice-wrapper"></div>
    <div id="dice-3d-text" style="color: white; font-size: 24px; font-weight: bold; margin-top: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
      サイコロを振っています…
    </div>
  </div>

  <!-- オンライン/CPU設定用ロビー画面 -->
  <div id="lobby-modal">
    <div class="lobby-box">
      <h2>🎲 桃鉄Web 設定</h2>
      
      <div style="text-align: left; margin-bottom: 15px;">
        <div style="margin-bottom: 12px; background: #e8f5e9; padding: 8px 12px; border-radius: 8px;">
          <label style="font-weight: bold; font-size: 13px; color: #2e7d32;">🏆 ゲームモード選択:</label>
          <select id="game-mode-select" style="margin-left: 8px; padding: 4px; font-weight: bold;">
            <option value="3years" selected>3年決戦 (初期資金5000万円)</option>
            <option value="5years">5年プレイ (初期資金1500万円)</option>
            <option value="infinite">無限モード (終了なし)</option>
          </select>
        </div>

        <label style="font-weight: bold; font-size: 14px;">🎮 プレイヤー構成設定 (最大4人):</label>
        <div id="player-config-list" style="margin-top: 8px;">
          <div class="player-setting-row">
            <span>🚃 P1: 桃太郎 (あなた)</span>
            <span style="font-weight:bold; color:#2196F3;">人間 (ホスト)</span>
          </div>
          <div class="player-setting-row">
            <span>🚅 P2: 金太郎</span>
            <select id="p2-type" onchange="updatePlayerConfigs()">
              <option value="human">人間 (オンライン)</option>
              <option value="cpu" selected>CPU (AI)</option>
              <option value="none">なし (2人プレイ時)</option>
            </select>
          </div>
          <div class="player-setting-row">
            <span>🐢 P3: 浦島</span>
            <select id="p3-type" onchange="updatePlayerConfigs()">
              <option value="human">人間 (オンライン)</option>
              <option value="cpu" selected>CPU (AI)</option>
              <option value="none">なし</option>
            </select>
          </div>
          <div class="player-setting-row">
            <span>👸 P4: 夜叉姫</span>
            <select id="p4-type" onchange="updatePlayerConfigs()">
              <option value="human">人間 (オンライン)</option>
              <option value="cpu">CPU (AI)</option>
              <option value="none" selected>なし</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 12px; text-align: left; background: #fff3e0; padding: 8px 12px; border-radius: 8px;">
          <label style="font-weight: bold; font-size: 13px; color: #e65100;">🤖 CPUの強さ設定:</label>
          <select id="cpu-level-select" style="margin-left: 8px; padding: 4px; font-weight: bold;">
            <option value="easy">よわい (半分迷子)</option>
            <option value="normal" selected>ふつう (たまに遠回り)</option>
            <option value="hard">つよい (ガチ最短ルート)</option>
          </select>
        </div>
      </div>

      <button class="lobby-btn btn-single" onclick="startSingleOrHostGame()">▶️ この設定でゲーム開始 (1人〜ホスト)</button>
      
      <div style="margin: 15px 0; border-top: 1px solid #eee; padding-top: 15px;">
        <p style="font-size: 12px; color: #666; margin: 4px 0;">オンラインの部屋に参加する場合はこちら</p>
        <input type="text" id="join-room-id" class="lobby-input" placeholder="部屋IDを入力">
        <button class="lobby-btn btn-join" onclick="joinRoom()">🚪 部屋に参加する (ゲスト)</button>
      </div>

      <div id="lobby-status" style="margin-top: 10px; font-weight: bold; color: #d81b60; font-size: 13px;"></div>
    </div>
  </div>

  <div class="app-container">
    <div class="left-area">
      <div class="header-group">
        <h1>🎲 桃鉄Web 🎲</h1>
        <button id="map-toggle-btn" class="map-btn-main" onclick="toggleMapView()">🗺 全体マップを開く</button>
      </div>

      <div class="overall-header-bar" id="overall-header">
        <div id="bar-players-info"></div>
        <div class="dest-info" style="color: #d81b60; font-weight: bold; background: #ffecb3; padding: 4px 12px; border-radius: 15px;">🎯 <span id="bar-dest-name">---</span></div>
      </div>

      <div id="turn-banner" class="turn-indicator" style="background: linear-gradient(135deg, #1e88e5, #1565c0);">
        👉 🚃 桃太郎社長 のターン
      </div>

      <div class="message-box" id="message">設定を完了してゲームを開始してください</div>

      <div class="map-outer" id="map-outer">
        <div class="map-container" id="map"></div>
      </div>

      <div class="controls-container">
        <button id="dice-btn" onclick="rollDice()">🎲 サイコロを振る！</button>
        <button id="card-btn" onclick="openCardModal()" disabled>🎴 カードをつかう</button>
        <button id="next-btn" onclick="nextTurn()">▶️ 次のターンへ</button>
      </div>
    </div>

    <div class="right-area">
      <div class="destination-banner">
        🎯 目的地: <span id="destination-name" style="color: #d81b60; font-size: 1.1em;">---</span>
      </div>

      <div class="status-card" style="opacity: 1; border-color: #ff9800; text-align: center;">
        <span style="font-size: 11px; color: #666;">日時: </span>
        <span id="date-display" style="font-weight: bold; color: #1565c0;">1年目 4月</span>
      </div>

      <div class="status-container" id="status-container"></div>

      <div class="info-panel" id="info-panel">
        <h3 id="panel-title">マス情報</h3>
        <div id="panel-content">マスをクリックすると詳細が表示されます。</div>
      </div>
    </div>
  </div>

  <!-- 分岐選択モーダル -->
  <div class="modal" id="branch-modal">
    <div class="modal-content" id="branch-modal-content">
      <div class="branch-header" id="branch-header">
        <h3 style="color: #333; margin: 0; font-size: 15px;">🔀 どっちへ進む？</h3>
        <button id="branch-minimize-btn" onclick="toggleMinimizeBranch(event)">ー</button>
      </div>
      <div id="branch-modal-body" class="branch-btn-group"></div>
    </div>
  </div>

  <!-- カードモーダル -->
  <div class="modal" id="card-modal">
    <div class="modal-content">
      <h3 style="color: #9c27b0; margin-top: 0;">🎴 カードを選択</h3>
      <div id="card-modal-body"></div>
      <button style="margin-top: 10px; background: #777; color: white;" onclick="closeCardModal()">閉じる</button>
    </div>
  </div>

  <!-- 決算モーダル -->
  <div class="modal" id="kessan-modal">
    <div class="modal-content">
      <h2 style="color: #e91e63; margin-top: 0;" id="kessan-title">🎊 決算発表 🎊</h2>
      <p id="kessan-year-text">1年目の決算です！</p>
      
      <table class="kessan-table" id="kessan-table"></table>

      <button style="margin-top: 10px; background:#ff9800; color:white;" id="kessan-close-btn" onclick="closeKessan()">次へ進む</button>
    </div>
  </div>

  <!-- 📜 JavaScriptファイルの順次読み込み（依存関係に注意） -->
  <script src="js/data.js"></script>
  <script src="js/network.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/cpu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
